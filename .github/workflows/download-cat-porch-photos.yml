name: Download Cat Porch Photos

on:
  push:
    branches:
      - claude/screened-cat-porch-page-4ZpXs
    paths-ignore:
      - 'assets/projects/cat-porch-*.avif'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claude/screened-cat-porch-page-4ZpXs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow pillow-avif-plugin

      - name: Download and convert photos
        run: python3 scripts/download-cat-porch-photos.py

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/projects/cat-porch-*.avif
          git diff --cached --quiet || git commit -m "Add cat porch AVIF photos from JobTread CDN"
          git push
